name: CD - CareStock

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    name: Generar artefacto CareStock
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: src/CareStock/pom.xml

      - name: Dar permisos al Maven Wrapper
        working-directory: src/CareStock
        run: chmod +x mvnw

      - name: Instalar entorno grafico virtual JavaFX
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0

      - name: Compilar aplicacion
        working-directory: src/CareStock
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            ./mvnw -B -ntp clean package

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CareStock-build
          path: src/CareStock/target/*.jar
          if-no-files-found: error
