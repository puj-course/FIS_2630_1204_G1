name: CI - CareStock

on:
  push:
    branches:
      - main
      - Pull
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: carestock-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Compilar, probar y empaquetar
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/CareStock

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21 y cache Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            src/CareStock/pom.xml
            src/CareStock/.mvn/wrapper/maven-wrapper.properties

      - name: Preparar Maven Wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Instalar pantalla virtual para pruebas JavaFX
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Compilar y ejecutar pruebas
        run: |
          echo "=== Entorno Java ==="
          java -version

          echo "=== Inicio Maven ==="
          date -u

          time xvfb-run -a -s "-screen 0 1920x1080x24" ./mvnw -B -ntp clean verify

          echo "=== Final Maven ==="
          date -u

      - name: Publicar artefacto CareStock
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CareStock-build
          path: src/CareStock/target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Publicar reportes JUnit y JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CareStock-reportes-pruebas
          path: |
            src/CareStock/target/surefire-reports/
            src/CareStock/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
