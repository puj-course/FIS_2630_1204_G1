name: CI - CareStock

on:
  push:
    branches:
      - main
      - Pull
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Compilar y verificar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: src/CareStock/pom.xml

      - name: Dar permisos al Maven Wrapper
        working-directory: src/CareStock
        run: chmod +x mvnw

      - name: Compilar y ejecutar verificaciones
        working-directory: src/CareStock
        run: ./mvnw -B clean verify
