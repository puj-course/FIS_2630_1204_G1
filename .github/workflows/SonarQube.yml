      - name: Preparar Maven Wrapper
        run: chmod +x FIS_2630_1204_G1/src/CareStock/mvnw

      - name: Compilar y ejecutar pruebas
        run: |
          echo "=== Verificar ubicación ==="
          pwd
          ls -la FIS_2630_1204_G1/src/CareStock
          test -f FIS_2630_1204_G1/src/CareStock/pom.xml

          echo "=== Entorno Java ==="
          java -version

          echo "=== Inicio Maven ==="
          date -u

          time FIS_2630_1204_G1/src/CareStock/mvnw \
            -f FIS_2630_1204_G1/src/CareStock/pom.xml \
            -B -ntp clean verify

          echo "=== Final Maven ==="
          date -u
