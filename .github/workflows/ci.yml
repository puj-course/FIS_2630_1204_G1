name: CI - CareStock

on:
  push:
    branches:
      - main
      - Pull
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: carestock-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Compilar, probar y empaquetar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/CareStock

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 y cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            src/CareStock/pom.xml
            src/CareStock/.mvn/wrapper/maven-wrapper.properties

      - name: Preparar Maven Wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Compilar y ejecutar pruebas
        run: |
          echo "=== Entorno Java ==="
          java -version

          echo "=== Inicio Maven ==="
          date -u

          time ./mvnw -B -ntp clean verify

          echo "=== Final Maven ==="
          date -u

      - name: Publicar artefacto CareStock
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CareStock-build
          path: src/CareStock/target/*.jar
          if-no-files-found: error
          retention-days: 7
