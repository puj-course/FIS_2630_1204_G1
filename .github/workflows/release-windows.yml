name: Release Windows - CareStock

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    name: Generar instalador Windows
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-2025
    timeout-minutes: 40

    defaults:
      run:
        shell: pwsh
        working-directory: src/CareStock

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Descargar codigo del tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: src/CareStock/pom.xml

      - name: Validar version del proyecto
        run: |
          [xml]$pom = Get-Content pom.xml
          $expected = $env:RELEASE_TAG.Substring(1)
          $actual = $pom.project.version

          if ($actual -ne $expected) {
            throw "El tag $env:RELEASE_TAG no coincide con Maven: $actual"
          }

      - name: Compilar probar y copiar dependencias
        run: |
          .\mvnw.cmd -B -ntp clean verify org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies "-DincludeScope=runtime" "-DoutputDirectory=target/release-input"

          if ($LASTEXITCODE -ne 0) {
            throw "Fallo Maven"
          }

      - name: Construir ejecutable e instalador
        run: |
          if ($env:RELEASE_TAG -notmatch '^v([0-9]+)\.([0-9]+)\.([0-9]+)(?:-[0-9A-Za-z.-]+)?$') {
            throw "Tag invalido: $env:RELEASE_TAG"
          }

          $nativeVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"

          $appJar = Get-ChildItem target -File -Filter 'CareStock-*.jar' |
            Where-Object { $_.Name -notmatch '(sources|javadoc|original)' } |
            Select-Object -First 1

          if (-not $appJar) {
            throw "No se encontro el JAR de CareStock"
          }

          New-Item -ItemType Directory -Force target/release-input, target/dist | Out-Null

          Copy-Item $appJar.FullName "target/release-input/$($appJar.Name)"

          $mainClass = 'org.example.carestock.LanzadorCareStock'

          jpackage --type app-image `
            --name CareStock `
            --app-version $nativeVersion `
            --input target/release-input `
            --main-jar $appJar.Name `
            --main-class $mainClass `
            --add-modules java.sql,java.desktop,java.naming,java.management,java.logging,jdk.crypto.ec `
            --dest target/dist

          if ($LASTEXITCODE -ne 0) {
            throw "Fallo jpackage app-image"
          }

          if (-not (Test-Path 'target/dist/CareStock/CareStock.exe')) {
            throw "No se genero CareStock.exe"
          }

          $wix = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'

          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue) -and (Test-Path "$wix/candle.exe")) {
            $env:PATH = "$wix;$env:PATH"
          }

          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            throw 'No se encuentra WiX v3'
          }

          jpackage --type exe `
            --name CareStock `
            --app-image target/dist/CareStock `
            --win-menu `
            --win-shortcut `
            --win-per-user-install `
            --dest target/dist

          if ($LASTEXITCODE -ne 0) {
            throw "Fallo jpackage exe"
          }

          $installer = Get-ChildItem target/dist -File -Filter '*.exe' |
            Select-Object -First 1

          if (-not $installer) {
            throw "No se genero el instalador"
          }

          Rename-Item $installer.FullName "CareStock-Setup-$($env:RELEASE_TAG).exe"

          Compress-Archive `
            -Path target/dist/CareStock `
            -DestinationPath "target/dist/CareStock-Portable-$($env:RELEASE_TAG).zip" `
            -Force

      - name: Adjuntar instalador a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "target/dist/CareStock-Setup-$($env:RELEASE_TAG).exe"
          $portable = "target/dist/CareStock-Portable-$($env:RELEASE_TAG).zip"

          gh release upload $env:RELEASE_TAG $installer $portable

          if ($LASTEXITCODE -ne 0) {
            throw 'No se pudieron subir los archivos'
          }
