services:
  carestock:
    build:
      context: ./src/CareStock
      dockerfile: Dockerfile

    image: carestock:latest

    # La configuracion local NO se copia a la imagen
    volumes:
      - ./src/CareStock/config/conexion-local.properties:/app/config/conexion-local.properties:ro

    environment:
      JAVA_TOOL_OPTIONS: "-Dprism.order=sw"
