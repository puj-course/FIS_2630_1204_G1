name: carestock

services:
  carestock:
    image: carestock:taller-visual

    build:
      context: ./src/CareStock
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:6080:6080"

    volumes:
      - type: bind
        source: ./src/CareStock/config/conexion-local.properties
        target: /app/config/conexion-local.properties
        read_only: true
        bind:
          create_host_path: false

    environment:
      JAVA_TOOL_OPTIONS: "-Dprism.order=sw"

    restart: unless-stopped
